  <script>
    // 主題在第一次繪製前就決定，避免白畫面閃爍；也讓 JS 尚未載入或載入失敗時
    // 仍然維持使用者選過的主題（HTML 預設已是 class="dark"）。
    (function () {
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {
        /* 無法讀取偏好時維持預設深色 */
      }
    })();
  </script>
